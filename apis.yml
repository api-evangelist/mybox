name: myBOX
description: myBOX was an on-demand self-storage service founded in 2015 in Seoul, South Korea, and
  backed by 500 Global. It delivered storage boxes to a user's door for storing unused luggage and
  goods, offering free pickup and a range of container sizes for documents, clothes, and bulky items.
  The company has since permanently closed; its site (my-box.kr) no longer resolves and it exposes no
  public API, developer portal, or technical surface. Retained in the API Evangelist network as an
  enrichment lead; no API artifacts exist to harvest.
